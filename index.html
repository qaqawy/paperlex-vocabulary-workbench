<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PaperLex · 文献词汇工作台</title>
  <style>
    :root{--ink:#18201d;--muted:#6c756f;--line:#dce2dd;--paper:#f4f1e9;--card:#fffdf8;--green:#1f5b49;--mint:#dcebe4;--red:#a23b35;--shadow:0 16px 40px rgba(31,55,45,.09)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:auto;padding:32px 24px 80px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:24px}.brand{font:700 28px/1.1 Georgia,"Microsoft YaHei",serif}.brand small{display:block;margin-top:8px;color:var(--muted);font:12px/1.2 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}.badge{padding:7px 11px;border:1px solid #b9c8c0;border-radius:99px;color:var(--green);font-size:12px;background:#edf6f1}.grid{display:grid;grid-template-columns:310px 1fr;gap:20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}aside{padding:18px;height:max-content;position:sticky;top:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:#4c5751}.upload{display:block;border:1px dashed #9db2a7;border-radius:14px;padding:20px 15px;text-align:center;background:#f4faf6;cursor:pointer}.upload:hover{background:#ebf5ef}.upload b{display:block;color:var(--green)}.upload span{font-size:12px;color:var(--muted)}input[type=file]{display:none}.papers{display:grid;gap:8px;margin-top:14px}.paper{padding:11px;border:1px solid var(--line);border-radius:11px;display:flex;gap:9px;align-items:flex-start}.paper input{margin-top:4px}.paper label{min-width:0;flex:1}.paper strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.paper small{color:var(--muted)}.del{border:0;background:none;color:#909994;cursor:pointer}.privacy{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}.main{padding:24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:19px}.hero h1{font:700 26px/1.2 Georgia,"Microsoft YaHei",serif;margin:0 0 6px}.hero p{color:var(--muted);margin:0;max-width:620px}.count{font:700 28px/1 Georgia;color:var(--green);text-align:right}.count small{display:block;font:12px Inter;color:var(--muted);margin-top:6px}.entry{display:grid;grid-template-columns:1fr auto;gap:10px;margin:22px 0 12px}.entry input{width:100%;padding:14px 16px;border:1px solid #b9c5be;border-radius:12px;background:white;font-size:16px;outline:none}.entry input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(31,91,73,.1)}button{border:0;border-radius:11px;padding:11px 16px;font-weight:650;cursor:pointer;font-family:inherit}.primary{background:var(--green);color:white}.primary:hover{background:#174738}.secondary{background:var(--mint);color:var(--green)}.ghost{background:transparent;border:1px solid var(--line);color:#4c5751}.danger{color:var(--red)}.hint{color:var(--muted);font-size:12px;margin-bottom:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0}.toolbar input{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:white;max-width:230px}.actions{display:flex;gap:8px;flex-wrap:wrap}.words{display:grid;gap:10px}.empty{text-align:center;padding:58px 20px;border:1px dashed #cbd3ce;border-radius:14px;color:var(--muted)}.word{display:grid;grid-template-columns:170px 1fr auto;gap:16px;padding:15px;border:1px solid var(--line);border-radius:13px;background:white;align-items:start}.word h3{margin:0;font:700 19px Georgia}.ipa{color:var(--green);font-size:13px;margin-top:3px}.meaning{font-size:14px}.meaning [contenteditable]{padding:2px 5px;border-radius:5px}.meaning [contenteditable]:focus{outline:1px solid #95aa9f;background:#f4faf6}.meta{color:var(--muted);font-size:11px;margin-top:7px}.status{display:inline-block;padding:2px 7px;border-radius:99px;background:#edf4f0;color:#4e675b;margin-left:5px}.icon{background:none;padding:3px;color:#7c8781;font-size:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#17231e;color:white;padding:11px 16px;border-radius:10px;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}dialog{border:0;border-radius:18px;max-width:740px;width:calc(100% - 32px);padding:0;box-shadow:0 24px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(20,29,25,.48)}.modal{padding:24px}.modal h2{margin:0 0 6px;font-family:Georgia,"Microsoft YaHei",serif}.groups{display:grid;gap:12px;max-height:55vh;overflow:auto;margin:18px 0}.group{border:1px solid var(--line);border-radius:12px;padding:13px}.group b{color:var(--green)}.group span{display:inline-block;margin:6px 6px 0 0;padding:4px 9px;background:#f0f4f1;border-radius:7px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}aside{position:static}.word{grid-template-columns:1fr}.hero{display:block}.count{text-align:left;margin-top:15px}.toolbar{align-items:flex-start;flex-direction:column}}@media print{body{background:white}.shell{max-width:none;padding:0}header,aside,.hero p,.entry,.toolbar,.hint,.icon,.badge{display:none!important}.grid{display:block}.panel,.main{box-shadow:none;border:0;padding:0}.hero{display:block;border:0}.hero h1{font-size:24px}.count{display:none}.word{break-inside:avoid;grid-template-columns:150px 1fr;border-radius:0;border-width:0 0 1px;padding:12px 0}.words{gap:0}.meta{display:none}.print-group{break-inside:avoid;margin:18px 0}.print-group h2{border-bottom:2px solid #1f5b49;padding-bottom:5px}.empty{display:none}}
    .form{margin-top:9px;color:#53625a;font-size:12px}.variants{margin-top:4px;color:var(--muted);font-size:11px}.sense{padding:7px 0;border-bottom:1px dashed #e1e6e2}.sense:last-child{border:0}.pos{display:inline-block;min-width:48px;color:var(--green);font-weight:700}.definition,.example{color:#737d77;font-size:12px;margin:3px 0 0 48px}.example{font-style:italic}.word-actions{display:grid;gap:5px}.retry{border:1px solid var(--line);background:#f7f9f7;color:#526158;padding:4px 7px;font-size:11px;border-radius:7px}
    @media print{
      @page{size:A4 portrait;margin:10mm 9mm 11mm}
      html,body{font-size:9pt;line-height:1.3;color:#111}
      .hero{margin:0 0 3mm;padding:0;border-bottom:1.2pt solid #222}
      .hero h1{font-size:0;margin:0 0 2mm}
      .hero h1::after{content:"英文文献词汇复习表";font:700 15pt/1.2 "Microsoft YaHei",sans-serif}
      .words{display:block;column-count:2;column-gap:8mm;counter-reset:vocab}
      .word{display:inline-block;width:100%;counter-increment:vocab;break-inside:avoid-column;page-break-inside:avoid;margin:0;padding:2.2mm 0;border:0;border-bottom:.5pt dotted #aaa;border-radius:0;background:#fff}
      .word>div:first-child{display:block}
      .word h3{display:inline;font:700 10.5pt/1.2 Georgia,serif}
      .word h3::before{content:counter(vocab) ". ";font:400 8pt/1.2 "Microsoft YaHei",sans-serif;color:#555}
      .ipa{display:inline;margin-left:2mm;color:#222;font-size:8pt}
      .form{display:inline;margin-left:2mm;font-size:7.5pt;color:#555}
      .variants{margin:1mm 0 0 5mm;font-size:7pt;line-height:1.2;color:#666}
      .meaning{margin:1mm 0 0 5mm;font-size:8.5pt;line-height:1.25}
      .sense{padding:.4mm 0;border:0}
      .pos{min-width:0;margin-right:1.5mm;font-size:7.5pt;color:#333}
      .definition,.example,.meta,.word-actions{display:none!important}
    }
  </style>
</head>
<body>
<div class="shell">
  <header><div class="brand">PaperLex<small>文献词汇 · 阅读伴侣</small></div><div class="badge">数据保存在本机浏览器</div></header>
  <div class="grid">
    <aside class="panel">
      <div class="section-title"><h2>文献库</h2><span id="paperCount">0 篇</span></div>
      <label class="upload"><input id="fileInput" type="file" accept="application/pdf,.pdf" multiple><b>＋ 上传英文 PDF</b><span>支持一次选择多篇文献</span></label>
      <div class="papers" id="papers"></div>
      <div class="privacy">工作台不分析、概括或上传论文正文。当前版本记录 PDF 名称，并在浏览器内提取文本，仅用于核对单词是否出现。</div>
    </aside>
    <main class="panel main">
      <div class="hero"><div><h1>今天读到什么新词？</h1><p>粘贴一个或多个英文单词。工作台会查询音标与中文释义，并记到所选文献下。</p></div><div class="count" id="wordCount">0<small>待复习词汇</small></div></div>
      <div class="entry"><input id="wordInput" placeholder="例如: elucidate, robust, passivation" autocomplete="off"><button class="primary" id="addBtn">查询并添加</button></div>
      <div class="hint">可用逗号、空格或换行分隔。公开词典结果可能不完整；释义可直接点击修改。</div>
      <div class="toolbar"><input id="search" placeholder="筛选单词或释义"><div class="actions"><button class="ghost" id="exportBtn">打印 / PDF</button><button class="secondary" id="summaryBtn">总结归类</button></div></div>
      <div class="words" id="words"></div>
    </main>
  </div>
</div>
<dialog id="summaryDialog"><div class="modal"><h2>归类预览</h2><p>系统按共享释义关键词和词典同义词归类。请检查后再替换当前词表。</p><div class="groups" id="groups"></div><div class="modal-actions"><button class="ghost" id="cancelSummary">继续编辑</button><button class="primary" id="confirmSummary">确认归类并清空旧词表</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
  const KEY='paperlex-v1'; let state=JSON.parse(localStorage.getItem(KEY)||'{"papers":[],"words":[],"summary":null}');
  const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const save=()=>{const compact={...state,papers:state.papers.map(({text,...p})=>p)};localStorage.setItem(KEY,JSON.stringify(compact));render()};
  const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};
  const partZh=p=>({noun:'名词',verb:'动词',adjective:'形容词',adverb:'副词',pronoun:'代词',preposition:'介词',conjunction:'连词',interjection:'感叹词',determiner:'限定词',unknown:'未知'})[(p||'unknown').toLowerCase()]||p||'未知';
  function morphology(word){let lemma=word,form='原形';if(/ily$/.test(word)){lemma=word.replace(/ily$/,'y');form='副词变体'}else if(/ied$/.test(word)){lemma=word.replace(/ied$/,'y');form='过去式/过去分词'}else if(/ing$/.test(word)&&word.length>5){lemma=word.slice(0,-3).replace(/(.)\1$/,'$1');form='现在分词/动名词'}else if(/ed$/.test(word)&&word.length>4){lemma=word.slice(0,-2).replace(/(.)\1$/,'$1');form='过去式/过去分词'}else if(/ies$/.test(word)){lemma=word.replace(/ies$/,'y');form='第三人称单数或复数'}else if(/s$/.test(word)&&!/(ss|us)$/.test(word)){lemma=word.slice(0,-1);form='第三人称单数或复数'}const variants=new Set([lemma]);if(/[^aeiou]y$/.test(lemma)){variants.add(lemma.slice(0,-1)+'ies');variants.add(lemma.slice(0,-1)+'ied');variants.add(lemma+'ing');variants.add(lemma.slice(0,-1)+'ily')}else{variants.add(lemma+'s');variants.add(lemma.endsWith('e')?lemma+'d':lemma+'ed');variants.add(lemma.endsWith('e')?lemma.slice(0,-1)+'ing':lemma+'ing')}variants.add(word);return{lemma,form,variants:[...variants]}}
  async function translate(text){if(!text)return'';try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|zh-CN');if(r.ok){const z=(await r.json()).responseData?.translatedText||'';return z&&!/^[A-Za-z ,.()'-]+$/.test(z)?z:''}}catch(e){}return''}
  function render(){
    $('#paperCount').textContent=state.papers.length+' 篇'; $('#wordCount').firstChild.textContent=state.words.length;
    $('#papers').innerHTML=state.papers.map(p=>`<div class="paper"><input type="checkbox" data-select="${p.id}" ${p.selected?'checked':''}><label><strong title="${esc(p.name)}">${esc(p.name)}</strong><small>${p.pages||'…'} 页 · ${p.text?'本次会话可核对':p.ready?'已记录':'读取中'}</small></label><button class="del" data-delpaper="${p.id}" title="移除">×</button></div>`).join('')||'<div class="empty" style="padding:22px 8px">尚未上传文献</div>';
    const q=$('#search').value.toLowerCase(); let list=state.words.filter(w=>(w.term+' '+w.zh).toLowerCase().includes(q));
    $('#words').innerHTML=list.map(w=>`<article class="word"><div><h3>${esc(w.term)}</h3><div class="ipa">${esc(w.ipa||'/ 暂无音标 /')}</div><div class="form">原形：<b>${esc(w.lemma||w.term)}</b>${w.form&&w.form!=='原形'?' · 当前为'+esc(w.form):''}</div><div class="variants">常见变体：${esc((w.variants||[w.term]).join(' · '))}</div></div><div class="meaning">${(w.senses?.length?w.senses:[{part:w.part||'未知',zh:w.zh||'暂无中文释义，请点击补充',definition:w.en||''}]).map((s,i)=>`<div class="sense"><span class="pos">${esc(partZh(s.part))}</span><span contenteditable="true" data-editsense="${w.id}:${i}">${esc(s.zh||'释义待补充')}</span>${s.definition?`<div class="definition">${esc(s.definition)}</div>`:''}${s.example?`<div class="example">例：${esc(s.example)}</div>`:''}</div>`).join('')}<div class="meta">${esc(w.paperNames||'未指定文献')} <span class="status">${w.found===true?'原文已核对':w.found===false?'未在已读取原文中定位':'未核对'}</span></div></div><div class="word-actions"><button class="retry" data-retry="${w.id}">重新查询</button><button class="icon" data-delword="${w.id}" title="删除">×</button></div></article>`).join('')||'<div class="empty">词表还是空的。<br>上传文献，然后粘贴阅读中遇到的单词。</div>';
  }
  async function extract(file,p){try{const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';for(let i=1;i<=pdf.numPages;i++){const c=await (await pdf.getPage(i)).getTextContent();text+=' '+c.items.map(x=>x.str).join(' ')}p.pages=pdf.numPages;p.text=text.toLowerCase();p.ready=true;save()}catch(e){p.ready=true;p.error=true;save();toast('PDF 文本读取失败，但仍可记录词汇')}}
  $('#fileInput').onchange=e=>{[...e.target.files].forEach(file=>{const p={id:crypto.randomUUID(),name:file.name,pages:0,selected:true,ready:false,text:''};state.papers.push(p);save();extract(file,p)});e.target.value=''};
  async function lookup(term){let ipa='',syn=[],raw=[];const morph=morphology(term);try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(term));if(r.ok){const entries=await r.json();ipa=entries.flatMap(d=>d.phonetics||[]).find(x=>x.text)?.text||entries[0]?.phonetic||'';for(const d of entries)for(const m of d.meanings||[]){syn.push(...(m.synonyms||[]));for(const x of (m.definitions||[]).slice(0,2))raw.push({part:m.partOfSpeech||'unknown',definition:x.definition||'',example:x.example||''})}}}catch(e){}raw=raw.slice(0,8);let senses=[];for(const s of raw)senses.push({...s,zh:await translate(s.definition)});if(!senses.length){const suffixPart=/(tion|ness|ity|ment)$/.test(term)?'noun':/ly$/.test(term)?'adverb':/(ous|ive|al|able|ible)$/.test(term)?'adjective':'unknown';senses=[{part:suffixPart,definition:'',example:'',zh:await translate(term)}]}const zh=senses.map(s=>s.zh).filter(Boolean).join('；');return{ipa,syn:[...new Set(syn)],senses,zh,part:senses[0].part,en:senses[0].definition,...morph}}
  async function addWords(){const terms=[...new Set($('#wordInput').value.toLowerCase().match(/[a-z]+(?:[-'][a-z]+)*/g)||[])];if(!terms.length)return toast('请先输入英文单词');const selected=state.papers.filter(p=>p.selected);$('#addBtn').disabled=true;$('#addBtn').textContent='查询中…';for(const term of terms){if(state.words.some(w=>w.term===term)){toast(term+' 已在词表中');continue}const d=await lookup(term);const ready=selected.filter(p=>p.text);state.words.unshift({id:crypto.randomUUID(),term,...d,paperIds:selected.map(p=>p.id),paperNames:selected.map(p=>p.name.replace(/\.pdf$/i,'')).join('；')||'未指定文献',found:ready.length?ready.some(p=>new RegExp('\\b'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(p.text||'')):null,created:Date.now()});save()}$('#wordInput').value='';$('#addBtn').disabled=false;$('#addBtn').textContent='查询并添加'}
  $('#addBtn').onclick=addWords;$('#wordInput').onkeydown=e=>{if(e.key==='Enter')addWords()};$('#search').oninput=render;
  document.onclick=async e=>{const s=e.target.dataset.select;if(s){const p=state.papers.find(x=>x.id===s);p.selected=e.target.checked;save()}const dp=e.target.dataset.delpaper;if(dp){state.papers=state.papers.filter(x=>x.id!==dp);save()}const dw=e.target.dataset.delword;if(dw){state.words=state.words.filter(x=>x.id!==dw);save()}const retry=e.target.dataset.retry;if(retry){const w=state.words.find(x=>x.id===retry);if(w){e.target.disabled=true;e.target.textContent='查询中…';Object.assign(w,await lookup(w.term));save();toast(w.term+' 已更新')}}};
  document.addEventListener('focusout',e=>{const id=e.target.dataset.edit;if(id){const w=state.words.find(x=>x.id===id);if(w){w.zh=e.target.textContent.trim();save()}}const key=e.target.dataset.editsense;if(key){const [wid,i]=key.split(':');const w=state.words.find(x=>x.id===wid);if(w){if(!w.senses)w.senses=[{part:w.part||'unknown',zh:w.zh||'',definition:w.en||''}];w.senses[+i].zh=e.target.textContent.trim();w.zh=w.senses.map(s=>s.zh).filter(Boolean).join('；');save()}}});
  const tokens=s=>new Set((s||'').toLowerCase().replace(/[，。；、]/g,' ').split(/\s+|[,;/]/).filter(x=>x.length>1));
  function classify(){const groups=[];for(const w of state.words){let best=null;for(const g of groups){const a=tokens(w.zh),b=tokens(g.label);const shared=[...a].some(x=>b.has(x));const synonym=g.words.some(x=>(x.syn||[]).includes(w.term)||(w.syn||[]).includes(x.term));if(shared||synonym){best=g;break}}if(best)best.words.push(w);else groups.push({label:w.zh||'未补充释义',words:[w]})}return groups}
  $('#summaryBtn').onclick=()=>{if(!state.words.length)return toast('当前没有可归类的单词');const gs=classify();$('#groups').innerHTML=gs.map(g=>`<div class="group"><b>${esc(g.label)}</b><div>${g.words.map(w=>`<span>${esc(w.term)} ${esc(w.ipa)}</span>`).join('')}</div></div>`).join('');$('#summaryDialog').showModal()};
  $('#cancelSummary').onclick=()=>$('#summaryDialog').close();
  $('#confirmSummary').onclick=()=>{const groups=classify();state.summary={created:Date.now(),groups};state.words=groups.map(g=>({...g.words[0],term:g.words.map(w=>w.term).join(' / '),ipa:g.words.map(w=>w.ipa).filter(Boolean).join(' · '),zh:g.label,paperNames:[...new Set(g.words.flatMap(w=>w.paperNames.split('；')))].join('；')}));save();$('#summaryDialog').close();toast('已归类，旧词条已由归类结果替换')};
  $('#exportBtn').onclick=()=>window.print();render();
</script>
</body>
</html>
